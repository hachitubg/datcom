<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Admin</title>
  <link rel="icon" type="image/png" href="/images/datcom_icon.png">
  <link rel="apple-touch-icon" href="/images/datcom_icon.png">
  <link rel="stylesheet" href="/assets/styles/admin.css">
</head>
<body>
  <div class="admin-auth-overlay" style="display:flex;">
    <div class="admin-auth-card">
      <div class="admin-auth-icon">🔐</div>
      <h2>Khu vực quản trị</h2>
      <p>Vui lòng nhập mật khẩu quản trị để tiếp tục.</p>
      <div class="admin-auth-input-wrap">
        <input id="adminPasswordInput" type="password" placeholder="Nhập mật khẩu admin">
      </div>
      <div id="adminAuthMessage" class="admin-auth-message"></div>
      <button class="btn-primary admin-auth-submit" type="button" id="loginBtn">Đăng nhập</button>
      <a href="/" class="admin-auth-back-link" id="adminBackLink">Về trang chủ</a>
    </div>
  </div>

  <script>
    const SITE_BASE_PATH = (() => {
      const firstSegment = window.location.pathname.split('/').filter(Boolean)[0] || '';
      const rootPaths = new Set(['admin', 'admin2', 'admin-login', 'admin.html', 'api', 'assets', 'images', 'game.html']);
      return firstSegment && !rootPaths.has(firstSegment) ? `/${firstSegment}` : '';
    })();

    function submitLogin() {
      const input = document.getElementById('adminPasswordInput');
      const message = document.getElementById('adminAuthMessage');
      const password = (input.value || '').trim();

      message.textContent = '';

      fetch(`${SITE_BASE_PATH}/api/admin/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      })
      .then(async (res) => {
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Đăng nhập thất bại');
        window.location.href = `${SITE_BASE_PATH}/admin`;
      })
      .catch((err) => {
        message.textContent = err.message;
        input.focus();
      });
    }

    document.getElementById('loginBtn').addEventListener('click', submitLogin);
    document.getElementById('adminBackLink').setAttribute('href', SITE_BASE_PATH || '/');
    document.getElementById('adminPasswordInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        submitLogin();
      }
    });
  </script>
</body>
</html>
