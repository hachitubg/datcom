# Nginx config cho datcom
# Đặt file này tại: /etc/nginx/sites-available/datcom
# Sau đó: ln -s /etc/nginx/sites-available/datcom /etc/nginx/sites-enabled/
#
# App chạy tại localhost:3000

server {
    listen 80;
    server_name comcogiang.io.vn www.comcogiang.io.vn;

    # Certbot sẽ tự thêm HTTPS redirect vào đây khi chạy certbot --nginx

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Giới hạn upload size nếu cần
    client_max_body_size 10M;
}
